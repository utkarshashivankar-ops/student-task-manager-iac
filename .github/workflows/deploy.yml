name: Deploy infrastructure

# push to main   -> validate, plan, APPLY  (deploys to Cloudflare)
# pull request   -> validate, plan only    (safe preview, nothing changes)
# manual         -> same as push
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "application/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time so two runs never fight over the state.
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Secrets are injected as environment variables - never written to code.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_workers_subdomain: ${{ vars.WORKERS_SUBDOMAIN }}
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt (style check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show outputs
        if: github.event_name != 'pull_request'
        run: terraform output
